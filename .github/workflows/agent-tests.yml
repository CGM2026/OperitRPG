name: D20 agent tests

# Runs the pure JVM engine tests and a debug Kotlin compile of the app on feature branches.
# Agents working on this repo do not build locally (see AGENTS.md); this workflow is their feedback loop.
on:
  push:
    branches: ['feat/**', 'fix/**', 'refactor/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore Gradle caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: d20-agent-tests-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/**', 'gradle.properties') }}
          restore-keys: |
            d20-agent-tests-${{ runner.os }}-
            d20-gradle-${{ runner.os }}-

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ''

      - name: Install SDK platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: rpg-agent tests
        run: ./gradlew -p rpg-agent test --console=plain

      - name: rpg-core tests
        run: ./gradlew -p rpg-core test --console=plain

      - name: App debug Kotlin compile
        run: ./gradlew :app:compileDebugKotlin --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: agent-test-reports
          path: |
            rpg-agent/build/reports/tests/
            rpg-core/build/reports/tests/
          if-no-files-found: ignore
