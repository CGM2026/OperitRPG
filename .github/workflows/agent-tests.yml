name: D20 agent tests

# Runs the pure JVM engine tests, the app unit tests and a debug Kotlin compile of the app on feature branches.
# Agents working on this repo do not build locally (see AGENTS.md); this workflow is their feedback loop.
on:
  push:
    branches: ['feat/**', 'fix/**', 'refactor/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore Gradle caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: d20-agent-tests-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/**', 'gradle.properties') }}
          restore-keys: |
            d20-agent-tests-${{ runner.os }}-
            d20-gradle-${{ runner.os }}-

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ''

      - name: Install SDK platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: rpg-agent tests
        shell: bash
        run: set -o pipefail; ./gradlew -p rpg-agent test --console=plain 2>&1 | tee "$RUNNER_TEMP/gradle-agent.log"

      - name: App debug Kotlin compile
        shell: bash
        run: set -o pipefail; ./gradlew :app:compileDebugKotlin --console=plain 2>&1 | tee "$RUNNER_TEMP/gradle-app.log"

      - name: App unit tests
        shell: bash
        run: set -o pipefail; ./gradlew :app:testDebugUnitTest --console=plain 2>&1 | tee "$RUNNER_TEMP/gradle-app-test.log"

      # kapt writes the Room schema JSON during the compile above. Publishing it lets a maintainer
      # commit the generated app/schemas/ file without a local Android toolchain.
      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: warn

      # Run pages show annotations without sign-in; agents read failures from them.
      - name: Publish failures as annotations
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, os, re, xml.etree.ElementTree as ET
          def esc(s): return s.replace('%','%25').replace('\r','').replace('\n','%0A')[:3000]
          temp = os.environ['RUNNER_TEMP']
          for log in glob.glob(temp + '/gradle-*.log'):
              for line in open(log, encoding='utf-8', errors='replace'):
                  m = re.match(r'^e: (?:file://)?(\S+?):(\d+):(\d+) (.*)', line.strip())
                  if m:
                      path = m[1].split('/OperitRPG/OperitRPG/')[-1]
                      print(f"::error file={path},line={m[2]},col={m[3]},title=Kotlin compile::{esc(m[4])}")
                  elif line.startswith('e: '):
                      print(f"::error title=Kotlin compile::{esc(line[3:].strip())}")
          for xml in glob.glob('rpg-*/build/test-results/test/*.xml') + glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              for case in ET.parse(xml).getroot().iter('testcase'):
                  for bad in list(case.findall('failure')) + list(case.findall('error')):
                      text = (bad.get('message') or '') + '\n' + (bad.text or '')[:1500]
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{esc(text)}")
          PY

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: agent-test-reports
          path: |
            rpg-agent/build/reports/tests/
            app/build/reports/tests/
          if-no-files-found: ignore
