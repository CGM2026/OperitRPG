name: D20 signed release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version (must increase)'
        required: true
        default: '0.2.0'
      version_code:
        description: 'Android versionCode (strictly increasing)'
        required: true
        default: '2'
      publish:
        description: 'Publish after build (use false for a candidate requiring upgrade smoke first)'
        required: true
        default: true
        type: boolean
  push:
    tags: ['rpg-v*']

concurrency:
  group: rpg-release
  cancel-in-progress: false
permissions:
  contents: write
env:
  JAVA_VERSION: '21'
  RPG_EXPECTED_SIGNER_SHA256: '8838939d69b547bbe6a27483da9819e07fe9e2799b66e5e3b51360df9cbbc373'

jobs:
  release:
    if: github.repository == 'CGM2026/OperitRPG'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false

      - name: Validate permanent signing credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.RPG_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RPG_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RPG_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RPG_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            test -n "${!name}" || { echo "Missing required release secret: $name" >&2; exit 1; }
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rpg-release.p12"
          chmod 600 "$RUNNER_TEMP/rpg-release.p12"

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Restore Gradle caches
        id: cache-gradle
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: d20-gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/**', 'gradle.properties') }}-${{ github.run_id }}
          restore-keys: |
            d20-gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/**', 'gradle.properties') }}-
            d20-gradle-${{ runner.os }}-

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ''

      - name: Install SDK platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Configure permanent signing and version
        env:
          STORE_PASSWORD: ${{ secrets.RPG_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RPG_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RPG_KEY_PASSWORD }}
          INPUT_VERSION: ${{ inputs.version_name }}
          INPUT_CODE: ${{ inputs.version_code }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, urllib.request, urllib.error
          from pathlib import Path
          env = os.environ
          tagged = env['GITHUB_REF'].startswith('refs/tags/')
          version = env['GITHUB_REF_NAME'].removeprefix('rpg-v') if tagged else env['INPUT_VERSION']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version):
              raise ValueError('Version must use x.y.z')
          if tagged:
              source = Path('app/build.gradle.kts').read_text()
              code = int(re.search(r'rpgVersionCode"\).orElse\("([0-9]+)"', source)[1])
          else:
              code = int(env['INPUT_CODE'])
          if not 0 < code < 2100000000:
              raise ValueError('Invalid Android versionCode')
          request = urllib.request.Request('https://api.github.com/repos/' + env['GITHUB_REPOSITORY'] + '/releases/latest', headers={'Authorization': 'Bearer ' + env['GH_TOKEN'], 'User-Agent': 'OperitRPG-release'})
          try:
              with urllib.request.urlopen(request) as response:
                  previous = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404: raise
          else:
              manifest_url = 'https://github.com/' + env['GITHUB_REPOSITORY'] + '/releases/download/' + previous['tag_name'] + '/update-manifest.json'
              with urllib.request.urlopen(manifest_url) as response:
                  manifest = json.load(response)
              if manifest['signerSha256'].lower() != env['RPG_EXPECTED_SIGNER_SHA256']:
                  raise ValueError('Previous release signing certificate differs from the permanent app identity')
              if code <= manifest['versionCode']:
                  raise ValueError('versionCode must strictly increase')
              if tuple(map(int,version.split('.'))) <= tuple(map(int,manifest['versionName'].split('.'))):
                  raise ValueError('versionName must strictly increase')
          def prop(value):
              return value.replace('\\', '\\\\').replace('\n','\\n').replace('\r','\\r').replace('=', '\\=').replace(':','\\:')
          with Path('local.properties').open('a') as output:
              for key, value in {'RELEASE_STORE_FILE': env['RUNNER_TEMP'] + '/rpg-release.p12', 'RELEASE_STORE_PASSWORD': env['STORE_PASSWORD'], 'RELEASE_KEY_ALIAS': env['KEY_ALIAS'], 'RELEASE_KEY_PASSWORD': env['KEY_PASSWORD']}.items():
                  output.write(key + '=' + prop(value) + '\n')
          with Path(env['GITHUB_ENV']).open('a') as output:
              output.write(f'RPG_VERSION={version}\nRPG_CODE={code}\nRPG_TAG=rpg-v{version}\n')
          PY

      - name: Run complete dedicated app tests, lint and optimized release build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :rpg-core:test :app:testReleaseUnitTest :app:lintVitalRelease :app:assembleRelease \
            -PrpgVersionName="$RPG_VERSION" -PrpgVersionCode="$RPG_CODE" \
            --max-workers=2 --no-parallel --stacktrace --no-daemon

      - name: Verify optimized APK and update identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          apk="release/operit-rpg-$RPG_VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" | tee release/signature.txt
          test "$(apkanalyzer manifest application-id "$apk")" = 'io.github.cgm2026.operitrpg'
          test "$(apkanalyzer manifest version-code "$apk")" = "$RPG_CODE"
          test "$(apkanalyzer manifest version-name "$apk")" = "$RPG_VERSION"
          test "$(apkanalyzer manifest target-sdk "$apk")" = '36'
          python3 - <<'PY'
          import hashlib, json, os, re, zipfile
          from pathlib import Path
          version = os.environ['RPG_VERSION']
          apk = Path(f'release/operit-rpg-{version}.apk')
          if not 0 < apk.stat().st_size < 50 * 1024**2:
              raise ValueError('Dedicated APK must be smaller than 50 MiB')
          certificate = re.search(r'Signer #1 certificate SHA-256 digest: ([a-fA-F0-9]+)', Path('release/signature.txt').read_text())[1].lower()
          if certificate != os.environ['RPG_EXPECTED_SIGNER_SHA256']:
              raise ValueError('APK certificate differs from the released 0.1.0 identity')
          def verify_apk_contents(archive):
              # ui-graphics-android 1.10.4 depends on Google's graphics-path 1.0.1.
              # Official AAR: four tiny libraries, 37,392 uncompressed bytes in total.
              allowed_native = {
                  'lib/arm64-v8a/libandroidx.graphics.path.so': (2, 183),
                  'lib/armeabi-v7a/libandroidx.graphics.path.so': (1, 40),
                  'lib/x86/libandroidx.graphics.path.so': (1, 3),
                  'lib/x86_64/libandroidx.graphics.path.so': (2, 62),
              }
              allowed_assets = {'assets/dexopt/baseline.prof', 'assets/dexopt/baseline.profm', 'assets/rainy-dock-v1.json', 'assets/plan.schema.json'}
              native_sizes = {}
              for item in archive.infolist():
                  if item.is_dir():
                      continue
                  if item.filename.startswith('lib/') or item.filename.endswith('.so'):
                      if item.filename not in allowed_native or item.filename in native_sizes:
                          raise ValueError('Unexpected native library in dedicated APK: ' + item.filename)
                      if not 0 < item.file_size < 64 * 1024:
                          raise ValueError('Compose graphics-path library exceeds 64 KiB: ' + item.filename)
                      with archive.open(item) as stream:
                          header = stream.read(20)
                      elf_class, machine = allowed_native[item.filename]
                      if header[:4] != b'\x7fELF' or header[4:6] != bytes([elf_class, 1]) or int.from_bytes(header[18:20], 'little') != machine:
                          raise ValueError('Compose graphics-path ELF does not match its ABI: ' + item.filename)
                      native_sizes[item.filename] = item.file_size
                  if item.filename.startswith('assets/'):
                      if item.filename not in allowed_assets or item.file_size > 1024**2:
                          raise ValueError('Unexpected or heavy APK asset: ' + item.filename)
              if sum(native_sizes.values()) >= 256 * 1024:
                  raise ValueError('Compose graphics-path native payload exceeds 256 KiB')
              return native_sizes
          with zipfile.ZipFile(apk) as archive:
              native_sizes = verify_apk_contents(archive)
          Path('release/apk-content-audit.json').write_text(json.dumps({'nativeLibraries':native_sizes, 'nativeTotalBytes':sum(native_sizes.values()), 'nativePerFileLimitBytes':65536, 'nativeTotalLimitBytes':262144}, indent=2)+'\n')
          with apk.open('rb') as stream:
              sha = hashlib.file_digest(stream, 'sha256').hexdigest()
          manifest = {'applicationId':'io.github.cgm2026.operitrpg', 'versionName':version, 'versionCode':int(os.environ['RPG_CODE']), 'apkUrl':f'https://github.com/CGM2026/OperitRPG/releases/download/rpg-v{version}/{apk.name}', 'sizeBytes':apk.stat().st_size, 'sha256':sha, 'signerSha256':certificate}
          Path('release/update-manifest.json').write_text(json.dumps(manifest, indent=2)+'\n')
          Path('release/SHA256SUMS').write_text(sha+'  '+apk.name+'\n')
          Path('release/source.json').write_text(json.dumps({'runId':int(os.environ['GITHUB_RUN_ID']), 'headSha':os.environ['GITHUB_SHA']}, indent=2)+'\n')
          PY
          cp docs/TODO/rpg-release/RELEASE_NOTES.md release/RELEASE_NOTES.md

      - name: Upload exact signed release candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: d20-release-candidate
          path: release/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Publish release
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RPG_TAG" release/*.apk release/update-manifest.json release/SHA256SUMS release/signature.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "二十面骰 $RPG_VERSION" \
            --notes-file docs/TODO/rpg-release/RELEASE_NOTES.md --latest

      - name: Save Gradle caches including failed builds
        if: always() && steps.cache-gradle.outputs.cache-primary-key != ''
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.cache-gradle.outputs.cache-primary-key }}

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: d20-build-evidence
          path: |
            app/build/reports/**
            app/build/test-results/**
            rpg-core/build/reports/**
            rpg-core/build/test-results/**
            app/schemas/**
            app/build/outputs/mapping/release/**
            release/*.json
            release/*.txt
            release/SHA256SUMS
          if-no-files-found: warn

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/rpg-release.p12" local.properties

