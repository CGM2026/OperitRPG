name: RPG signed release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version (must increase, e.g. 0.1.0)'
        required: true
        default: '0.1.0'
      version_code:
        description: 'Android versionCode (strictly increasing)'
        required: true
        default: '1'
  push:
    tags: ['rpg-v*']

concurrency:
  group: rpg-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '22'
  ANDROID_NDK_VERSION: '25.1.8937393'
  ANDROID_CMAKE_VERSION: '3.22.1'
  ANDROID_API_LEVEL: '26'
  RUST_VERSION: '1.88.0'
  MANUAL_DEPS_DIR: manual-deps

jobs:
  release:
    if: github.repository == 'CGM2026/OperitRPG'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Validate permanent signing credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.RPG_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RPG_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RPG_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RPG_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            test -n "${!name}" || { echo "Missing required release secret: $name" >&2; exit 1; }
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rpg-release.p12"
          chmod 600 "$RUNNER_TEMP/rpg-release.p12"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Initialize terminal submodule
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync -- terminal
          git submodule update --init --recursive --depth 1 terminal
          git submodule status -- terminal

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Restore Gradle dependency and build cache
        id: cache-gradle
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: rpg-gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/**', 'gradle.properties') }}-${{ github.run_id }}
          restore-keys: |
            rpg-gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/**', 'gradle.properties') }}-
            rpg-gradle-${{ runner.os }}-

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ''

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "ndk;$ANDROID_NDK_VERSION" \
            "cmake;$ANDROID_CMAKE_VERSION"

      - name: Identify native compilation cache context
        id: native-cache-context
        shell: bash
        run: |
          set -euo pipefail
          context=$( { printf '%s\n' "$GITHUB_WORKSPACE" "$ANDROID_HOME" "$ImageOS" "$ImageVersion"; find "$ANDROID_HOME/ndk" "$ANDROID_HOME/cmake" -maxdepth 2 -name source.properties -print -exec cat {} \; | sort; } | sha256sum | cut -d' ' -f1 )
          echo "context=$context" >> "$GITHUB_OUTPUT"

      # Ninja files contain absolute workspace/SDK paths. Reuse only with identical paths,
      # runner image/toolchains and native sources/configuration; Gradle/Ninja still validate them.
      - name: Restore native compilation artifacts
        id: cache-native-products
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            **/.cxx
            **/build/intermediates/cxx
          key: rpg-native-products-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-cache-context.outputs.context }}-${{ hashFiles('**/*.cpp', '**/*.cc', '**/*.c', '**/*.h', '**/*.hpp', '**/*.S', '**/*.cmake', '**/CMakeLists.txt', '**/*.gradle.kts', 'gradle/**', 'gradle.properties', '.gitmodules') }}

      - name: Restore Android CMake source cache
        id: cache-cmake
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            **/.cxx/operit_deps/*-src
          key: android-cmake-sources-${{ runner.os }}-${{ runner.arch }}-arm64-v8a-ndk-${{ env.ANDROID_NDK_VERSION }}-cmake-${{ env.ANDROID_CMAKE_VERSION }}-${{ hashFiles('cmake/**', '**/CMakeLists.txt', '**/*.cmake', '**/build.gradle.kts', 'gradle.properties') }}

      - name: Restore Android dependency cache
        id: cache-manual-deps
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.MANUAL_DEPS_DIR }}
          key: android-full-deps-${{ runner.os }}-${{ hashFiles('ci/script/download_android_dependencies.sh', 'ci/script/prepare_android_dependencies.py') }}

      - name: Restore generated STT asset cache
        id: cache-stt
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: app/build/generated/stt-model-assets
          key: stt-model-assets-${{ runner.os }}-${{ hashFiles('app/config/stt-model-assets.properties') }}

      - name: Download Android dependencies
        if: steps.cache-manual-deps.outputs.cache-hit != 'true'
        run: bash ci/script/download_android_dependencies.sh full "$MANUAL_DEPS_DIR"

      - name: Prepare Android dependencies
        id: prepare-manual-deps
        run: |
          python3 ci/script/prepare_android_dependencies.py \
            --profile full \
            --archives "$MANUAL_DEPS_DIR" \
            --repository "$GITHUB_WORKSPACE"

          mkdir -p build-evidence
          find "$MANUAL_DEPS_DIR" -type f -name '*.zip' -exec sha256sum {} \; > build-evidence/dependency-sha256.txt

      # Save validated archives immediately, independently of later Android build results.
      - name: Save prepared Android dependencies
        if: steps.cache-manual-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.MANUAL_DEPS_DIR }}
          key: ${{ steps.cache-manual-deps.outputs.cache-primary-key }}

      - name: Restore native ripgrep cache
        id: cache-ripgrep
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/native_ripgrep/target
          key: native-ripgrep-arm64-${{ runner.os }}-${{ runner.arch }}-ndk-${{ env.ANDROID_NDK_VERSION }}-api-${{ env.ANDROID_API_LEVEL }}-rust-${{ env.RUST_VERSION }}-${{ hashFiles('tools/native_ripgrep/Cargo.toml', 'tools/native_ripgrep/Cargo.lock', 'tools/native_ripgrep/**/*.rs', 'tools/native_ripgrep/build_native_ripgrep.ps1') }}

      - name: Build native ripgrep
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API_LEVEL}-clang"
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup target add --toolchain "$RUST_VERSION" aarch64-linux-android
          cargo "+$RUST_VERSION" build \
            --manifest-path tools/native_ripgrep/Cargo.toml \
            --release \
            --target aarch64-linux-android \
            --locked
          install -Dm755 \
            tools/native_ripgrep/target/aarch64-linux-android/release/liboperit_ripgrep.so \
            app/src/main/jniLibs/arm64-v8a/liboperit_ripgrep.so
          test -s app/src/main/jniLibs/arm64-v8a/liboperit_ripgrep.so

      - name: Save built native ripgrep
        if: steps.cache-ripgrep.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/native_ripgrep/target
          key: ${{ steps.cache-ripgrep.outputs.cache-primary-key }}

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install -g pnpm@10.34.5
          npm ci --no-audit --no-fund
          npm --prefix web-chat ci --no-audit --no-fund

      - name: Build WebChat assets
        run: |
          npm run build:webchat

      - name: Build bundled ToolPkg packages
        run: |
          npm run build:examples:github
          python3 tools/example_packages/sync_example_packages.py --no-hot-reload

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Configure permanent signing and version
        env:
          STORE_PASSWORD: ${{ secrets.RPG_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RPG_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RPG_KEY_PASSWORD }}
          INPUT_VERSION: ${{ inputs.version_name }}
          INPUT_CODE: ${{ inputs.version_code }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, urllib.request, urllib.error
          from pathlib import Path
          env = os.environ
          tagged = env['GITHUB_REF'].startswith('refs/tags/')
          version = env['GITHUB_REF_NAME'].removeprefix('rpg-v') if tagged else env['INPUT_VERSION']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version):
              raise ValueError('Version must use x.y.z')
          if tagged:
              source = Path('app/build.gradle.kts').read_text()
              code = int(re.search(r'rpgVersionCode"\).orElse\("([0-9]+)"', source)[1])
          else:
              code = int(env['INPUT_CODE'])
          if not 0 < code < 2100000000:
              raise ValueError('Invalid Android versionCode')
          request = urllib.request.Request('https://api.github.com/repos/' + env['GITHUB_REPOSITORY'] + '/releases/latest', headers={'Authorization': 'Bearer ' + env['GH_TOKEN'], 'User-Agent': 'OperitRPG-release'})
          try:
              with urllib.request.urlopen(request) as response:
                  previous = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404: raise
          else:
              manifest_url = 'https://github.com/' + env['GITHUB_REPOSITORY'] + '/releases/download/' + previous['tag_name'] + '/update-manifest.json'
              with urllib.request.urlopen(manifest_url) as response:
                  manifest = json.load(response)
              if code <= manifest['versionCode']:
                  raise ValueError('versionCode must strictly increase')
              if tuple(map(int,version.split('.'))) <= tuple(map(int,manifest['versionName'].split('.'))):
                  raise ValueError('versionName must strictly increase')
          def prop(value):
              return value.replace('\\', '\\\\').replace('\n','\\n').replace('\r','\\r').replace('=', '\\=').replace(':','\\:')
          with Path('local.properties').open('a') as output:
              for key, value in {'RELEASE_STORE_FILE': env['RUNNER_TEMP'] + '/rpg-release.p12', 'RELEASE_STORE_PASSWORD': env['STORE_PASSWORD'], 'RELEASE_KEY_ALIAS': env['KEY_ALIAS'], 'RELEASE_KEY_PASSWORD': env['KEY_PASSWORD']}.items():
                  output.write(key + '=' + prop(value) + '\n')
          with Path(env['GITHUB_ENV']).open('a') as output:
              output.write(f'RPG_VERSION={version}\nRPG_CODE={code}\nRPG_TAG=rpg-v{version}\n')
          PY

      - name: Compile and test RPG integration
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :rpg-core:test :app:testReleaseUnitTest --tests 'com.ai.assistance.operit.rpg.*' :app:lintVitalRelease \
            -PrpgVersionName="$RPG_VERSION" -PrpgVersionCode="$RPG_CODE" -PrpgOnlyTests=true \
            -Pkotlin.compiler.execution.strategy=in-process \
            '-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' \
            --max-workers=2 --no-parallel --stacktrace --no-daemon

      - name: Build complete signed APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease \
            -PrpgVersionName="$RPG_VERSION" -PrpgVersionCode="$RPG_CODE" \
            -Pkotlin.compiler.execution.strategy=in-process \
            '-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' \
            --max-workers=2 --no-parallel --stacktrace --no-daemon

      # Source/model downloads remain useful when a later compile or test fails.
      # These steps preserve caches only; the original Gradle failure still fails this job.
      - name: Save downloaded Android CMake sources
        if: always() && steps.cache-cmake.outputs.cache-primary-key != '' && steps.cache-cmake.outputs.cache-hit != 'true' && hashFiles('**/.cxx/operit_deps/*-src/CMakeLists.txt') != ''
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            **/.cxx/operit_deps/*-src
          key: ${{ steps.cache-cmake.outputs.cache-primary-key }}

      - name: Save native compilation artifacts
        if: always() && steps.cache-native-products.outputs.cache-primary-key != '' && steps.cache-native-products.outputs.cache-hit != 'true' && hashFiles('**/build/intermediates/cxx/**/*.so') != ''
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            **/.cxx
            **/build/intermediates/cxx
          key: ${{ steps.cache-native-products.outputs.cache-primary-key }}

      # Only Gradle's user caches are persisted: no project local.properties or signing files.
      - name: Save Gradle dependency and build cache
        if: always() && steps.cache-gradle.outputs.cache-primary-key != '' && steps.cache-gradle.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.cache-gradle.outputs.cache-primary-key }}

      - name: Save downloaded STT assets
        if: always() && steps.cache-stt.outputs.cache-primary-key != '' && steps.cache-stt.outputs.cache-hit != 'true' && hashFiles('app/build/generated/stt-model-assets/**') != ''
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: app/build/generated/stt-model-assets
          key: ${{ steps.cache-stt.outputs.cache-primary-key }}

      - name: Verify APK and generate update manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          apk="release/operit-rpg-$RPG_VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" | tee release/signature.txt
          test "$(apkanalyzer manifest application-id "$apk")" = 'io.github.cgm2026.operitrpg'
          test "$(apkanalyzer manifest version-code "$apk")" = "$RPG_CODE"
          test "$(apkanalyzer manifest version-name "$apk")" = "$RPG_VERSION"
          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          version = os.environ['RPG_VERSION']
          apk = Path(f'release/operit-rpg-{version}.apk')
          certificate = re.search(r'Signer #1 certificate SHA-256 digest: ([a-fA-F0-9]+)', Path('release/signature.txt').read_text())[1].lower()
          manifest = {'applicationId':'io.github.cgm2026.operitrpg', 'versionName':version, 'versionCode':int(os.environ['RPG_CODE']), 'apkUrl':f'https://github.com/CGM2026/OperitRPG/releases/download/rpg-v{version}/{apk.name}', 'sizeBytes':apk.stat().st_size, 'sha256':hashlib.file_digest(apk.open('rb'),'sha256').hexdigest(), 'signerSha256':certificate}
          if not 0 < manifest['sizeBytes'] <= 2 * 1024**3: raise ValueError('APK exceeds updater size limit')
          Path('release/update-manifest.json').write_text(json.dumps(manifest, indent=2)+'\n')
          Path('release/SHA256SUMS').write_text(manifest['sha256']+'  '+apk.name+'\n')
          PY

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RPG_TAG" release/*.apk release/update-manifest.json release/SHA256SUMS release/signature.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "雨夜跑团 $RPG_VERSION" --notes-file docs/TODO/rpg-release/RELEASE_NOTES.md --latest

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rpg-build-reports
          path: |
            app/build/reports/**
            rpg-core/build/reports/**
            app/schemas/**
            build-evidence/**
          if-no-files-found: warn

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/rpg-release.p12" local.properties

