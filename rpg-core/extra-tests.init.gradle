// Optional standalone JVM checks against the live Android sources. No copied source snapshot.
// Run from rpg-core: ../gradlew -I extra-tests.init.gradle test
gradle.projectsEvaluated {
    rootProject {
        def packagePath = 'com/ai/assistance/operit'
        sourceSets.main.kotlin {
            srcDir(rootProject.file('../app/src/main/java'))
            include("${packagePath}/rpg/core/**")
            include("${packagePath}/rpg/backup/**")
            include("${packagePath}/rpg/update/RpgRelease.kt")
            include("${packagePath}/rpg/update/RpgUpdatePolicy.kt")
            include("${packagePath}/rpg/update/RpgDownloadVerifier.kt")
        }
        sourceSets.test.kotlin {
            srcDir(rootProject.file('../app/src/test/java'))
            include("${packagePath}/rpg/core/**")
            include("${packagePath}/rpg/backup/**")
            include("${packagePath}/rpg/update/RpgUpdatePolicyTest.kt")
            include("${packagePath}/rpg/update/RpgDownloadVerifierTest.kt")
        }
        sourceSets.test.resources.srcDir(rootProject.file('../app/src/test/resources'))
        // Needed by live manifest/backup sources only in this opt-in test build.
        dependencies { implementation 'org.json:json:20240303' }
        tasks.named('compileKotlin').configure {
            doFirst {
                def selected = sourceSets.main.kotlin.files
                assert selected.any { it.name == 'RpgUpdatePolicy.kt' }
                assert !selected.any { it.name in ['RpgUpdateManager.kt', 'RpgUpdateButton.kt'] }
                assert !selected.any { it.path.contains('isolated-update-src') }
                logger.lifecycle('Standalone RPG checks compile {} live source files', selected.size())
            }
        }
    }
}
